<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Power Discipline</title>
<style>
:root{--ink:#18233d;--muted:#7c87a2;--paper:#f4f7ff;--card:rgba(255,255,255,.9);--line:#e2e8fa;--blue:#617fee;--violet:#8c70ef;--mint:#3caf91;--rose:#d06b85;--yellow:#c99427;--shadow:0 14px 32px rgba(46,68,130,.10)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 8% 0,#e5edff 0,transparent 28%),radial-gradient(circle at 98% 18%,#f0eaff 0,transparent 26%),var(--paper);color:var(--ink);font:14px/1.5 Inter,Arial,sans-serif}.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:22px;padding:15px max(20px,calc((100vw - 1220px)/2));background:rgba(255,255,255,.76);border-bottom:1px solid rgba(119,139,185,.14);backdrop-filter:blur(16px)}.brand{font-size:13px;font-weight:900;letter-spacing:.09em;background:linear-gradient(115deg,#476ee8,#8964e9);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}.nav{display:flex;gap:5px;overflow:auto}.nav button,.button{border:0;cursor:pointer;font:inherit;font-weight:800}.nav button{background:transparent;color:#77819e;padding:9px 12px;border-radius:9px;white-space:nowrap}.nav button.active,.nav button:hover{background:#e7edff;color:#4867dc}.wrap{max-width:1220px;margin:auto;padding:38px 22px 70px}.tab{display:none}.tab.active{display:block}.eyebrow{font-size:11px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:#6879ca}.hero{display:flex;justify-content:space-between;gap:22px;align-items:end;margin-bottom:25px}.hero h1{font-size:clamp(30px,4vw,50px);letter-spacing:-.045em;line-height:1.05;margin:6px 0 9px}.hero p{margin:0;color:var(--muted);max-width:670px}.button{padding:10px 14px;border-radius:10px;color:white;background:linear-gradient(120deg,#5a7bf1,#8064e9);box-shadow:0 8px 18px rgba(83,112,234,.25)}.button.ghost{color:#59698f;background:white;border:1px solid var(--line);box-shadow:none}.button.danger{color:#a94661;background:#fff4f7;border-color:#f0c8d2}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card,.goal-panel,.month-panel,.entry-panel{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:19px;overflow:hidden}.card:before{content:"";position:absolute;left:0;top:0;right:0;height:5px;background:linear-gradient(90deg,#7393ff,#8c70ef)}.card:nth-child(2):before{background:linear-gradient(90deg,#70d4c2,#6fa7ee)}.card:nth-child(3):before{background:linear-gradient(90deg,#f2bd62,#ef8a91)}.label,.section-title{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:900;color:#8994af}.metric{font-size:36px;font-weight:900;letter-spacing:-.055em;margin:8px 0 3px}.note{font-size:12px;color:var(--muted)}.status{display:inline-block;margin-top:7px;padding:4px 8px;border-radius:8px;background:#fff1d8;color:#a96c1d;font-size:11px;font-weight:900}.section{margin-top:33px}.section-head{display:flex;justify-content:space-between;align-items:end;gap:18px;margin-bottom:13px}.section h2{margin:0;font-size:23px;letter-spacing:-.035em}.section p{margin:3px 0 0;color:var(--muted);font-size:12px}.goal-panel{padding:0}.goal-top{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:20px 21px 15px;background:linear-gradient(120deg,#fafbff,#f4f7ff);border-bottom:1px solid var(--line)}.goal-list{padding:5px 21px 13px}.goal-row{display:grid;grid-template-columns:minmax(140px,2fr) 90px 100px 100px;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid #edf0f8}.goal-row:last-child{border:0}.goal-name{font-weight:800}.progress{height:8px;background:#edf0f8;border-radius:9px;overflow:hidden;margin-top:6px}.progress span{display:block;height:100%;background:linear-gradient(90deg,#55bda5,#72a5f1);border-radius:inherit}.goal-num{font-size:12px;color:var(--muted);text-align:right}.goal-num b{display:block;color:#425174;font-size:14px}.month-panel{padding:0}.month-top{padding:20px 22px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:start;gap:15px}.chart-wrap{padding:17px 22px 12px}.chart{width:100%;height:245px;display:block;overflow:visible}.chart-label{fill:#94a0ba;font-size:10px;font-weight:800}.legend{display:flex;flex-wrap:wrap;gap:9px;margin:0 0 11px}.legend span{display:inline-flex;align-items:center;gap:6px;padding:5px 8px;border-radius:999px;background:#f7f9ff;border:1px solid #e5eafa;color:#667492;font-size:11px;font-weight:800}.dot{width:8px;height:8px;border-radius:50%}.month-footer{padding:0 22px 19px;font-size:12px;color:var(--muted)}.form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.field{display:grid;gap:6px}.field label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:900;color:#8994af}input,select{width:100%;min-width:0;border:1px solid #dce4f7;border-radius:9px;background:white;padding:10px 11px;color:var(--ink);font:inherit}input:focus,select:focus{outline:3px solid rgba(91,121,239,.16);border-color:#7791ef}.entry-panel{margin-top:16px}.entry-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:14px}.entry-metric{padding:12px;background:#f7f9ff;border:1px solid #e4eafa;border-radius:11px}.entry-metric b{display:block;font-size:12px;margin-bottom:7px}.entry-metric input{padding:8px}.roster{display:grid;gap:10px}.habit-row{display:grid;grid-template-columns:2fr 1fr 125px;gap:12px;align-items:center;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:13px;box-shadow:0 7px 18px rgba(46,68,130,.06)}.habit-name{font-weight:900}.habit-row small{display:block;color:var(--muted);margin-top:3px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:13px;background:white}table{border-collapse:collapse;width:100%;min-width:620px}th,td{padding:11px;text-align:left;border-bottom:1px solid #edf0f8}th{background:#f0f4ff;color:#6574a1;font-size:11px;text-transform:uppercase;letter-spacing:.08em}td{font-size:13px}.empty{padding:28px;color:var(--muted);text-align:center}.footer{margin-top:38px;color:#8c96af;text-align:center;font-size:12px}@media(max-width:850px){.top{display:block}.nav{margin-top:10px}.hero{display:block}.hero .button{margin-top:16px}.grid,.form-grid{grid-template-columns:1fr 1fr}.goal-row{grid-template-columns:1fr 75px 84px}.goal-row .button{grid-column:1/-1}.entry-grid{grid-template-columns:1fr 1fr}.habit-row{grid-template-columns:1fr 1fr}.habit-row .button{grid-column:1/-1}}@media(max-width:540px){.wrap{padding:28px 15px 55px}.grid,.form-grid,.entry-grid{grid-template-columns:1fr}.goal-row{grid-template-columns:1fr 1fr}.goal-row .goal-name{grid-column:1/-1}.habit-row{grid-template-columns:1fr}.goal-top,.month-top{display:block}.goal-top .button,.month-top .button{margin-top:12px}}
</style>
</head>
<body>
<header class="top"><div class="brand">POWER DISCIPLINE</div><nav class="nav" id="nav"></nav></header>
<main class="wrap">
<section class="tab active" id="dashboard"></section>
<section class="tab" id="input"></section>
<section class="tab" id="habits"></section>
<section class="tab" id="review"></section>
<section class="tab" id="settings"></section>
<div class="footer">Power Discipline · данные сохраняются локально в этом браузере</div>
</main>
<script>
(()=>{'use strict';
const KEY='power-discipline-v17'; const LEGACY='power-discipline-v2';
const today=()=>new Date().toISOString().slice(0,10); const monthKey=d=>(d||today()).slice(0,7);
const monthName=k=>new Intl.DateTimeFormat('ru-RU',{month:'long',year:'numeric'}).format(new Date(k+'-01T12:00:00'));
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const avg=a=>{a=a.filter(x=>Number.isFinite(x));return a.length?a.reduce((s,x)=>s+x,0)/a.length:null};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const defaults={version:17,goals:[{id:'sales',name:'Продажи интенсива',plan:6,fact:0,unit:'продаж'},{id:'income',name:'Личный доход',plan:200000,fact:138000,unit:'₽'},{id:'interview',name:'Провести интервью',plan:5,fact:0,unit:'интервью'}],habits:[{id:'h1',name:'Подъём до 09:00',note:'ежедневная дисциплина'},{id:'h2',name:'Тренировка',note:'физическая база'},{id:'h3',name:'1 полезное действие',note:'действие для роста'}],days:[],monthSnapshots:[],deepWork:[]};
function normalize(raw){let d=raw&&typeof raw==='object'?raw:{}; let x=JSON.parse(JSON.stringify(defaults)); x.goals=Array.isArray(d.goals)?d.goals.map(g=>({id:g.id||uid(),name:g.name||'Цель',plan:Number(g.plan)||1,fact:Number(g.fact)||0,unit:g.unit||''})):x.goals; x.habits=Array.isArray(d.habits)?d.habits.map(h=>({id:h.id||uid(),name:h.name||'Привычка',note:h.note||''})):x.habits; x.days=Array.isArray(d.days)?d.days.map(day=>({date:day.date,m:Array.isArray(day.m)?day.m.map(Number):[],h:day.h||{},g:day.g||{}})).filter(day=>/^\d{4}-\d{2}-\d{2}$/.test(day.date)):[]; x.monthSnapshots=Array.isArray(d.monthSnapshots)?d.monthSnapshots:[]; x.deepWork=Array.isArray(d.deepWork)?d.deepWork:[]; return x}
let data; try{data=normalize(JSON.parse(localStorage.getItem(KEY)||localStorage.getItem(LEGACY)||'null'))}catch(e){data=normalize(null)};
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function pct(g){return Math.max(0,Math.min(100,Math.round((Number(g.fact)||0)/(Number(g.plan)||1)*100)))}
function filled(d){return d&&((d.m||[]).some(v=>Number.isFinite(Number(v)))||Object.keys(d.h||{}).length||Object.keys(d.g||{}).length)}
function score(d){let m=(d.m||[]).filter(v=>Number.isFinite(Number(v)));return m.length?avg(m)/4:null}
function monthDays(key){return data.days.filter(d=>d.date.slice(0,7)===key&&filled(d))}
function snapshot(key){if(!key||data.monthSnapshots.some(s=>s.month===key))return;let ds=monthDays(key);let scores=ds.map(score);let habits=data.habits.map(h=>avg(ds.map(d=>Number(d.h?.[h.id]))));let goals=data.goals.map(g=>({id:g.id,pct:pct(g)})); data.monthSnapshots.push({month:key,days:ds.length,discipline:avg(scores),habits:avg(habits),goals:avg(goals.map(g=>g.pct/100)),savedAt:new Date().toISOString()});save()}
function rollover(){let current=monthKey(),known=[...data.days.map(d=>monthKey(d.date)),...data.monthSnapshots.map(s=>s.month)].filter(Boolean);known.filter(k=>k<current).forEach(snapshot);save()}
rollover();
const tabs=[['dashboard','Дашборд'],['input','Отметка дня'],['habits','Привычки'],['review','Месяцы'],['settings','Данные']];
let active='dashboard';
function nav(){document.querySelector('#nav').innerHTML=tabs.map(([id,name])=>`<button class="${id===active?'active':''}" data-tab="${id}">${name}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{active=b.dataset.tab;render()})}
function goPanel(){return `<section class="section"><div class="section-head"><div><h2>Прогресс целей</h2><p>Цели вынесены в отдельный просторный блок: список не сжимает главную страницу.</p></div><button class="button" id="addGoal">Добавить цель</button></div><div class="goal-panel"><div class="goal-top"><div><div class="section-title">Фокус текущего периода</div><b>Идём к целям спокойно и последовательно</b></div><span class="note">${data.goals.length} активных целей</span></div><div class="goal-list">${data.goals.length?data.goals.map(g=>`<div class="goal-row"><div class="goal-name">${esc(g.name)}<div class="progress"><span style="width:${pct(g)}%"></span></div></div><div class="goal-num"><b>${pct(g)}%</b>выполнено</div><div class="goal-num"><b>${Number(g.fact).toLocaleString('ru-RU')}</b>${esc(g.unit||'факт')}</div><button class="button ghost editGoal" data-id="${g.id}">Изменить</button></div>`).join(''):'<div class="empty">Добавьте первую цель</div>'}</div></div></section>`}
function dashboard(){let current=monthKey(),ds=monthDays(current),disc=avg(ds.map(score)),habit=avg(data.habits.map(h=>avg(ds.map(d=>Number(d.h?.[h.id]))))),goal=avg(data.goals.map(g=>pct(g)/100));return `<div class="hero"><div><div class="eyebrow">Личная операционная система</div><h1>Дисциплина в действии.</h1><p>${monthName(current)} · отмечайте день, сохраняйте темп и сравнивайте прогресс по месяцам.</p></div><button class="button" data-tab="input">Отметить сегодняшний день</button></div><div class="grid"><article class="card"><div class="label">Индекс дисциплины</div><div class="metric">${disc===null?'—':Math.round(disc*100)+'%'}</div><div class="note">Средний результат за ${ds.length||0} заполненных дней</div><span class="status">${disc===null?'Начните отметки':disc>=.8?'Высокий темп':'Чиним процесс'}</span></article><article class="card"><div class="label">Ритм привычек</div><div class="metric">${habit===null?'—':Math.round(habit*100)+'%'}</div><div class="note">Учитываются только привычки, без Deep Work</div></article><article class="card"><div class="label">Текущий темп</div><div class="metric">${goal===null?'—':Math.round(goal*100)+'%'}</div><div class="note">Среднее выполнение активных целей</div></article></div>${goPanel()}<section class="section month-panel"><div class="month-top"><div><div class="section-title">Динамика по месяцам</div><h2>Как меняется дисциплина</h2><p>Итог сохраняется автоматически при переходе в новый месяц.</p></div><button class="button ghost" data-tab="review">Открыть историю</button></div>${monthlyChart()}</section>`}
function monthlySeries(){let current=monthKey(),live=makeLive(current);let all=[...data.monthSnapshots.filter(s=>s.month!==current),live].sort((a,b)=>a.month.localeCompare(b.month));return all.slice(-8)}
function makeLive(month){let ds=monthDays(month),disc=avg(ds.map(score)),hab=avg(data.habits.map(h=>avg(ds.map(d=>Number(d.h?.[h.id]))))),go=avg(data.goals.map(g=>pct(g)/100));return{month,discipline:disc,habits:hab,goals:go,days:ds.length,live:true}}
function monthlyChart(){let a=monthlySeries();if(!a.length)return '<div class="empty">История появится после первых отметок.</div>';let w=760,h=245,l=35,r=12,t=16,b=34,pt=(v,i)=>`${l+(w-l-r)*(a.length===1?.5:i/(a.length-1))},${t+(1-(v??0))*(h-t-b)}`,line=key=>a.map((x,i)=>pt(x[key],i)).join(' '),dots=(key,color)=>a.map((x,i)=>x[key]===null?'' : `<circle cx="${pt(x[key],i).split(',')[0]}" cy="${pt(x[key],i).split(',')[1]}" r="4" fill="white" stroke="${color}" stroke-width="2.5"/>`).join('');let grid=[0,.25,.5,.75,1].map(v=>{let y=t+(1-v)*(h-t-b);return `<path d="M${l} ${y}H${w-r}" stroke="#e4eafa" stroke-dasharray="3 6"/><text x="0" y="${y+4}" class="chart-label">${Math.round(v*100)}%</text>`}).join('');let labels=a.map((x,i)=>`<text x="${l+(w-l-r)*(a.length===1?.5:i/(a.length-1))}" y="${h-8}" text-anchor="middle" class="chart-label">${new Intl.DateTimeFormat('ru-RU',{month:'short'}).format(new Date(x.month+'-01T12:00:00'))}</text>`).join('');return `<div class="chart-wrap"><div class="legend"><span><i class="dot" style="background:#617fee"></i>Индекс дисциплины</span><span><i class="dot" style="background:#3caf91"></i>Ритм привычек</span><span><i class="dot" style="background:#d06b85"></i>Прогресс целей</span></div><svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">${grid}<polyline points="${line('discipline')}" fill="none" stroke="#617fee" stroke-width="3.5" stroke-linejoin="round"/><polyline points="${line('habits')}" fill="none" stroke="#3caf91" stroke-width="3.5" stroke-linejoin="round"/><polyline points="${line('goals')}" fill="none" stroke="#d06b85" stroke-width="3.5" stroke-linejoin="round"/>${dots('discipline','#617fee')}${dots('habits','#3caf91')}${dots('goals','#d06b85')}${labels}</svg></div><div class="month-footer">Текущий месяц обновляется в реальном времени; завершённые месяцы сохраняются как снимки для сравнения.</div>`}
function input(){let d=data.days.find(x=>x.date===today())||{date:today(),m:[null,null,null,null,null],h:{},g:{}};return `<div class="hero"><div><div class="eyebrow">Ежедневная отметка</div><h1>Соберите сегодняшний день.</h1><p>Deep Work не входит в общий ростер привычек и учитывается отдельно.</p></div></div><div class="entry-panel"><div class="section-title">${today()}</div><div class="entry-grid">${['Фокус','Deep Work, ч','Энергия','Действия','Сон'].map((n,i)=>`<div class="entry-metric"><b>${n}</b><input class="dailyM" data-i="${i}" type="number" min="0" max="4" step="1" value="${d.m[i]??''}" placeholder="0–4"></div>`).join('')}</div><div class="section" style="margin-top:20px"><div class="section-title">Отметка привычек</div><div class="roster" style="margin-top:10px">${data.habits.map(h=>`<div class="habit-row"><div class="habit-name">${esc(h.name)}<small>${esc(h.note)}</small></div><select class="dailyH" data-id="${h.id}"><option value="">Не отмечено</option><option value="1" ${Number(d.h?.[h.id])===1?'selected':''}>Выполнено</option><option value="0" ${Number(d.h?.[h.id])===0?'selected':''}>Не выполнено</option></select></div>`).join('')}</div></div><div class="section" style="margin-top:20px"><div class="section-title">Вклад в цели сегодня</div><div class="form-grid" style="margin-top:10px">${data.goals.map(g=>`<div class="field"><label>${esc(g.name)}</label><select class="dailyG" data-id="${g.id}"><option value="">Нет отметки</option><option value="1" ${Number(d.g?.[g.id])===1?'selected':''}>Да</option><option value="0" ${Number(d.g?.[g.id])===0?'selected':''}>Нет</option></select></div>`).join('')}</div></div><button class="button" id="saveDay" style="margin-top:20px">Сохранить день</button></div>`}
function habits(){return `<div class="hero"><div><div class="eyebrow">Активный ростер</div><h1>Привычки.</h1><p>Deep Work не является привычкой: его показатели ведутся отдельно в дневной отметке.</p></div><button class="button" id="addHabit">Добавить привычку</button></div><div class="roster">${data.habits.map(h=>`<div class="habit-row"><div class="habit-name">${esc(h.name)}<small>${esc(h.note)}</small></div><button class="button ghost editHabit" data-id="${h.id}">Изменить</button><button class="button ghost danger delHabit" data-id="${h.id}">Удалить</button></div>`).join('')}</div>`}
function review(){let rows=monthlySeries().slice().reverse();return `<div class="hero"><div><div class="eyebrow">История роста</div><h1>Месяцы и результаты.</h1><p>При запуске приложения в новом месяце предыдущий автоматически фиксируется и остаётся доступным для сравнения.</p></div></div><section class="month-panel">${monthlyChart()}</section><section class="section"><div class="section-head"><div><h2>Архив месяцев</h2><p>Завершённые периоды не перезаписываются.</p></div></div><div class="table-wrap"><table><thead><tr><th>Месяц</th><th>Дней с отметкой</th><th>Дисциплина</th><th>Привычки</th><th>Цели</th></tr></thead><tbody>${rows.map(s=>`<tr><td>${monthName(s.month)} ${s.live?'· сейчас':''}</td><td>${s.days||0}</td><td>${s.discipline==null?'—':Math.round(s.discipline*100)+'%'}</td><td>${s.habits==null?'—':Math.round(s.habits*100)+'%'}</td><td>${s.goals==null?'—':Math.round(s.goals*100)+'%'}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">Нет данных</td></tr>'}</tbody></table></div></section>`}
function settings(){return `<div class="hero"><div><div class="eyebrow">Данные</div><h1>Резервная копия.</h1><p>Экспортируйте данные перед обновлениями или переносом приложения.</p></div></div><div class="form-grid"><div class="entry-panel"><b>Экспорт</b><p class="note">Скачать все привычки, цели, дневные отметки и архив месяцев в JSON.</p><button class="button" id="export">Скачать копию</button></div><div class="entry-panel"><b>Импорт</b><p class="note">Восстановить данные из ранее скачанного JSON-файла.</p><input type="file" id="import" accept="application/json"></div><div class="entry-panel"><b>Сброс</b><p class="note">Удаляет данные только из этого браузера. Действие необратимо.</p><button class="button ghost danger" id="reset">Удалить данные</button></div></div>`}
function render(){nav();document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.id===active));let el=document.querySelector('#'+active);el.innerHTML=({dashboard,input,habits,review,settings})[active]();bind()}
function bind(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{active=b.dataset.tab;render()});document.querySelector('#addGoal')?.addEventListener('click',()=>editGoal());document.querySelectorAll('.editGoal').forEach(b=>b.onclick=()=>editGoal(b.dataset.id));document.querySelector('#addHabit')?.addEventListener('click',()=>editHabit());document.querySelectorAll('.editHabit').forEach(b=>b.onclick=()=>editHabit(b.dataset.id));document.querySelectorAll('.delHabit').forEach(b=>b.onclick=()=>{if(confirm('Удалить привычку?')){data.habits=data.habits.filter(h=>h.id!==b.dataset.id);save();render()}});document.querySelector('#saveDay')?.addEventListener('click',saveDay);document.querySelector('#export')?.addEventListener('click',exportData);document.querySelector('#import')?.addEventListener('change',importData);document.querySelector('#reset')?.addEventListener('click',()=>{if(confirm('Удалить все локальные данные?')){localStorage.removeItem(KEY);data=normalize(null);save();render()}})}
function editGoal(id){let g=data.goals.find(x=>x.id===id);let name=prompt('Название цели',g?.name||'');if(name===null||!name.trim())return;let plan=Number(prompt('План',g?.plan??1));if(!Number.isFinite(plan)||plan<=0)return;let fact=Number(prompt('Текущий факт',g?.fact??0));let unit=prompt('Единица измерения',g?.unit||'')??'';if(g)Object.assign(g,{name:name.trim(),plan,fact:Number.isFinite(fact)?fact:0,unit});else data.goals.push({id:uid(),name:name.trim(),plan,fact:Number.isFinite(fact)?fact:0,unit});save();render()}
function editHabit(id){let h=data.habits.find(x=>x.id===id);let name=prompt('Название привычки',h?.name||'');if(name===null||!name.trim())return;let note=prompt('Короткое описание',h?.note||'')??'';if(h)Object.assign(h,{name:name.trim(),note});else data.habits.push({id:uid(),name:name.trim(),note});save();render()}
function saveDay(){let m=[...document.querySelectorAll('.dailyM')].map(x=>x.value===''?null:Math.max(0,Math.min(4,Number(x.value))));let h={};document.querySelectorAll('.dailyH').forEach(x=>{if(x.value!=='')h[x.dataset.id]=Number(x.value)});let g={};document.querySelectorAll('.dailyG').forEach(x=>{if(x.value!=='')g[x.dataset.id]=Number(x.value)});let i=data.days.findIndex(x=>x.date===today()),d={date:today(),m,h,g};if(i>=0)data.days[i]=d;else data.days.push(d);save();active='dashboard';render()}
function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='power-discipline-backup-'+today()+'.json';a.click();URL.revokeObjectURL(a.href)}
function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{data=normalize(JSON.parse(r.result));rollover();save();render();alert('Данные восстановлены')}catch(err){alert('Не удалось прочитать файл')}};r.readAsText(f)}
render();
})();
</script>
</body>
</html>
