<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Power Discipline</title><style>
:root{--ink:#18233d;--muted:#7b87a1;--paper:#f4f7ff;--card:#ffffffdf;--line:#e1e8fa;--blue:#627fee;--mint:#35ae91;--rose:#d06b85;--gold:#d59a36;--shadow:0 14px 32px #34487a18}*{box-sizing:border-box}body{margin:0;color:var(--ink);font:14px/1.5 Inter,Arial,sans-serif;background:radial-gradient(circle at 5% 0,#e3edff 0,transparent 29%),radial-gradient(circle at 100% 18%,#f0eaff 0,transparent 27%),var(--paper)}.top{position:sticky;top:0;z-index:10;padding:15px max(18px,calc((100vw - 1220px)/2));display:flex;gap:24px;align-items:center;background:#ffffffc9;backdrop-filter:blur(14px);border-bottom:1px solid #e5eafa}.brand{font-size:13px;font-weight:900;letter-spacing:.1em;white-space:nowrap;background:linear-gradient(115deg,#486ee8,#8c65e8);-webkit-background-clip:text;background-clip:text;color:transparent}.nav{display:flex;gap:5px;overflow:auto}.nav button,.button{font:inherit;font-weight:800;border:0;cursor:pointer}.nav button{white-space:nowrap;padding:9px 12px;background:transparent;color:#77819e;border-radius:9px}.nav button.active,.nav button:hover{background:#e7edff;color:#4867dc}.wrap{max-width:1220px;margin:auto;padding:38px 22px 70px}.tab{display:none}.tab.active{display:block}.hero{display:flex;justify-content:space-between;align-items:end;gap:18px;margin-bottom:25px}.eyebrow,.label{font-size:11px;font-weight:900;letter-spacing:.11em;text-transform:uppercase;color:#8390ad}.hero h1{font-size:clamp(30px,4vw,50px);line-height:1.05;letter-spacing:-.045em;margin:7px 0 9px}.hero p,.note{color:var(--muted);margin:0}.button{color:#fff;padding:10px 14px;border-radius:10px;background:linear-gradient(120deg,#597af0,#8064e9);box-shadow:0 8px 18px #5370ea40}.button.ghost{color:#59698f;background:#fff;border:1px solid var(--line);box-shadow:none}.button.danger{color:#ad4963;background:#fff3f6;border-color:#f0cad4}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card,.panel{position:relative;overflow:hidden;padding:19px;background:var(--card);border:1px soli y{margin-top:14px}.scale{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-top:14px}.scale-card{padding:13px;background:#f7f9ff;border:1px solid #e4eafa;border-radius:12px}.scale-card b{display:block;font-size:13px;margin-bottom:3px}.scale-card small{display:block;min-height:34px;color:var(--muted);font-size:11px;margin-bottom:9px}.score-box{margin-top:18px;padding:17px 18px;border-radius:13px;background:linear-gradient(130deg,#edf3ff,#faf9ff);border:1px solid #dce5ff;display:flex;align-items:center;gap:18px}.score-ring{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;font-size:17px;font-weight:900;background:conic-gradient(var(--blue) var(--p),#e7ebf7 0);position:relative;flex:0 0 auto}.score-ring:after{content:"";position:absolute;inset:8px;border-radius:50%;background:#f8faff}.score-ring b{z-index:1}.verdict b{font-size:16px}.verdict p{margin:3px 0 0;color:#657391}.roster{display:grid;gap:10px}.habit-row{display:grid;grid-template-columns:2fr 1fr 120px;gap:12px;align-items:center;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:13px;box-shadow:0 7px 18px #3048750d}.habit-name{font-weight:900}.habit-name small{display:block;color:var(--muted);font-weight:400;margin-top:3px}.analysis-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}.week-row{display:grid;grid-template-columns:105px 1fr 42px;gap:10px;align-items:center;margin:13px 0}.week-row b{font-size:12px}.week-row span:last-child{text-align:right;color:#5e6e97;font-weight:900;font-size:12px}.bar{height:9px;border-radius:8px;background:#edf0f8;overflow:hidden}.bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#6884ed,#8b6fe8)}.chart{display:block;width:100%;height:240px;overflow:visible}.chart-label{fill:#93a0ba;font-size:10px;font-weight:800}.legend{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}.legend span{display:inline-flex;align-items:center;gap:5px;padding:5px 8px;border-radius:999px;border:1px solid #e3e9fa;background:#f8f9ff;font-size:11px;font-weight:800;color:#667492}.dot{width:8px;height:8px;border-radius:50%}.chart-wrap{padding:17px 22px}.chart-footer{padding:0 22px 19px;color:var(--muted);font-size:12px}.table-wrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:13px}table{border-collapse:collapse;width:100%;min-width:620px}th,td{padding:11px;text-align:left;border-bottom:1px solid #edf0f8}th{background:#eff3ff;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#6574a1}.empty{padding:28px;text-align:center;color:var(--muted)}.footer{margin-top:38px;color:#8c96af;text-align:center;font-size:12px}@media(max-width:850px){.top{display:block}.nav{margin-top:10px}.hero{display:block}.hero .button{margin-top:15px}.grid,.analysis-grid{grid-template-columns:1fr}.form-grid,.scale{grid-template-columns:1fr 1fr}.goal-row{grid-template-columns:1fr 78px 90px}.goal-row .button{grid-column:1/-1}.habit-row{grid-template-columns:1fr 1fr}.habit-row .button{grid-column:1/-1}}@media(max-width:530px){.wrap{padding:27px 15px 55px}.grid,.form-grid,.scale{grid-template-columns:1fr}.goal-row{grid-template-columns:1fr 1fr}.goal-row .goal-name{grid-column:1/-1}.panel-top{display:block}.panel-top .button{margin-top:10px}.habit-row{grid-template-columns:1fr}.score-box{align-items:start}.week-row{grid-template-columns:88px 1fr 38px}}
</style></head><body><header class="top"><div class="brand">POWER DISCIPLINE</div><nav class="nav" id="nav"></nav></header><main class="wrap"><section class="tab active" id="dashboard"></section><section class="tab" id="input"></section><section class="tab" id="habits"></section><section class="tab" id="review"></section><section class="tab" id="settings"></section><div class="footer">Power Discipline · данные сохраняются локально в этом браузере</div></main><script>
(()=>{'use strict';const KEY='power-discipline-v18',OLD=['power-discipline-v17','power-discipline-v2'];const today=()=>new Date().toISOString().slice(0,10),mkey=d=>(d||today()).slice(0,7),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6),avg=a=>{a=a.filter(Number.isFinite);return a.length?a.reduce((s,x)=>s+x,0)/a.length:null},esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const monthName=k=>new Intl.DateTimeFormat('ru-RU',{month:'long',year:'numeric'}).format(new Date(k+'-01T12:00:00'));const fields=[['focus','Фокус','Насколько вы удерживали внимание на главном','focus'],['energy','Энергия','Ресурс и физическая готовность действовать','energy'],['action','Ключевые действия','Насколько выполнены главные действия дня','action'],['recovery','Восстановление','Насколько восстановленным вы проснулись','recovery']];
const defaults={version:18,goals:[{id:'sales',name:'Продажи интенсива',plan:6,fact:0,unit:'продаж'},{id:'income',name:'Личный доход',plan:200000,fact:138000,unit:'₽'}],habits:[{id:'h1',name:'Подъём до 09:00',note:'ежедневная дисциплина'},{id:'h2',name:'Тренировка',note:'физическая база'}],days:[],goalHabitLinks:[],monthSnapshots:[]};
function legacyMetrics(m){if(!Array.isArray(m))return{};if(m.length===5)return{focus:n(m[0]),energy:n(m[2]),action:n(m[3]),recovery:n(m[4])};return{focus:n(m[0]),energy:n(m[1]),action:n(m[2]),recovery:n(m[3])}}function n(v){v=Number(v);return Number.isFinite(v)?Math.max(1,Math.min(10,v)):null}function normalize(x){x=x&&typeof x==='object'?x:{};let d=JSON.parse(JSON.stringify(defaults));d.goals=Array.isArray(x.goals)?x.goals.map(g=>({id:g.id||uid(),name:g.name||'Цель',plan:Number(g.plan)||1,fact:Number(g.fact)||0,unit:g.unit||''})):d.goals;d.habits=Array.isArray(x.habits)?x.habits.map(h=>({id:h.id||uid(),name:h.name||'Привычка',note:h.note||''})):d.habits;d.goalHabitLinks=Array.isArray(x.goalHabitLinks)?x.goalHabitLinks.filter(l=>l&&d.goals.some(g=>g.id===l.goalId)&&d.habits.some(h=>h.id===l.habitId)).map(l=>({goalId:l.goalId,habitId:l.habitId})):[];d.days=Array.isArray(x.days)?x.days.map(day=>({date:day.date,metrics:day.metrics||legacyMetrics(day.m),h:day.h||{},g:day.g||{}})).filter(day=>/^\d{4}-\d{2}-\d{2}$/.test(day.date)):[];d.monthSnapshots=[];return d}let raw=null;try{raw=JSON.parse(localStorage.getItem(KEY)||OLD.map(k=>localStorage.getItem(k)).find(Boolean)||'null')}catch(e){}let data=normalize(raw);const save=()=>localStorage.setItem(KEY,JSON.stringify(data));
function dayValues(d){return fields.map(([k])=>n(d.metrics?.[k])).filter(v=>v!==null)}function dscore(d){let a=dayValues(d);return a.length?avg(a)/10:null}function filled(d){return dayValues(d).length||Object.keys(d.h||{}).length||Object.keys(d.g||{}).length}function monthDays(k){return data.days.filter(d=>mkey(d.date)===k&&filled(d))}function pct(g){return Math.max(0,Math.min(100,Math.round((Number(g.fact)||0)/(Number(g.plan)||1)*100)))}function live(k){let ds=monthDays(k);return{month:k,days:ds.length,discipline:avg(ds.map(dscore)),habits:avg(data.habits.map(h=>avg(ds.map(d=>Number(d.h?.[h.id]))))),goals:avg(data.goals.map(g=>pct(g)/100))}}function snapshot(k){if(!k||data.monthSnapshots.some(s=>s.month===k))return;data.monthSnapshots.push(live(k));save()}function rollover(){let now=mkey(),months=[...new Set(data.days.map(d=>mkey(d.date)).filter(k=>k<now))];months.forEach(snapshot);save()}rollover();
const tabs=[['dashboard','Дашборд'],['input','Отметка дня'],['habits','Привычки'],['review','Месяцы'],['settings','Данные']];let active='dashboard';function nav(){navEl.innerHTML=tabs.map(x=>`<button class="${x[0]===active?'active':''}" data-tab="${x[0]}">${x[1]}</button>`).join('')}const navEl=document.querySelector('#nav');
function quality(s,mode='day'){if(s===null)return['Нет оценки','Заполните хотя бы один показатель, чтобы увидеть вывод.'];let p=Math.round(s*100);if(p>=85)return['Сильный устойчивый день','Система работает: сохраняйте ритм и не добавляйте лишнюю нагрузку.'];if(p>=70)return['Хорошая опора','Темп достаточный. Усильте самый слабый фактор, а не пытайтесь улучшить всё одновременно.'];if(p>=50)return['Неровный день','Есть рабочая база, но один-два фактора заметно тянут результат вниз. Выберите один корректор на завтра.'];return['День требует восстановления','Не усиливайте давление. Начните со сна, ресурса и одного действительно важного действия.']}
function dayInsight(metrics){let a=fields.map(([k,title])=>[title,n(metrics[k])]).filter(x=>x[1]!==null);if(!a.length)return['Заполните шкалы','Оцените состояние по шкале от 1 до 10.'];let min=a.reduce((x,y)=>x[1]<y[1]?x:y),max=a.reduce((x,y)=>x[1]>y[1]?x:y),q=quality(avg(a.map(x=>x[1]))/10);let extra=min[0]==='Восстановление'?'Завтра начните с более бережного вечера и времени подъёма.':min[0]==='Ключевые действия'?'Сформулируйте одно ключевое действие на начало завтрашнего дня.':min[0]==='Фокус'?'Сократите отвлечения и выделите один защищённый рабочий блок.':'Снизьте второстепенную нагрузку и восстановите ресурс.';return[q[0],`Сильная сторона — «${max[0]}» (${max[1]}/10). Точка роста — «${min[0]}» (${min[1]}/10). ${extra}`]}
function goalPanel(){return `<section class="section"><div class="section-head"><div><h2>Прогресс целей</h2><p>Цели живут в отдельном блоке и не сжимают верхнюю аналитику.</p></div><button class="button" id="addGoal">Добавить цель</button></div><div class="panel goal-panel"><div class="panel-top"><div><div class="label">Фокус текущего периода</div><b>Превращаем намерения в измеримый результат</b></div><span class="note">${data.goals.length} активных целей</span></div><div class="goal-list">${data.goals.map(g=>`<div class="goal-row"><div class="goal-name">${esc(g.name)}<small style="display:block;margin-top:4px;color:var(--muted);font-weight:400">${data.goalHabitLinks.filter(l=>l.goalId===g.id).map(l=>data.habits.find(h=>h.id===l.habitId)?.name).filter(Boolean).join(' · ')||'Привычки не выбраны'}</small><div class="progress"><span style="width:${pct(g)}%"></span></div><button class="button ghost editGoalLinks" data-id="${g.id}" style="margin-top:9px">Привычки</button></div><div class="goal-num"><b>${pct(g)}%</b>выполнено</div><div class="goal-num"><b>${Number(g.fact).toLocaleString('ru-RU')}</b>${esc(g.unit||'факт')}</div><button class="button ghost editGoal" data-id="${g.id}">Изменить</button></div>`).join('')||'<div class="empty">Добавьте первую цель</div>'}</div></div></section>`}
function weekly(){let ds=monthDays(mkey()).filter(d=>d.date<=today()).slice(-7);let rows=fields.map(([k,title])=>[title,avg(ds.map(d=>n(d.metrics?.[k])))]);let disc=avg(ds.map(dscore)),q=quality(disc);return `<section class="section"><div class="section-head"><div><h2>Аналитика состояния</h2><p>Средние оценки за последние семь заполненных дней. Шкала — от 1 до 10.</p></div></div><div class="analysis-grid"><div class="panel">${rows.map(([name,val])=>`<div class="week-row"><b>${name}</b><div class="bar"><i style="width:${(val||0)*10}%"></i></div><span>${val===null?'—':val.toFixed(1)}</span></div>`).join('')}</div><div class="panel verdict"><div class="label">Вывод по текущему ритму</div><b>${q[0]}</b><p>${q[1]}</p></div></div></section>`}
function chart(){let a=[...data.monthSnapshots.filter(s=>s.month!==mkey()),live(mkey())].sort((x,y)=>x.month.localeCompare(y.month)).slice(-8);if(!a.length)return'<div class="empty">История появится после первой заполненной отметки.</div>';let w=760,h=240,l=35,r=12,t=15,b=33,x=i=>l+(w-l-r)*(a.length===1?.5:i/(a.length-1)),y=v=>t+(1-(v??0))*(h-t-b),line=k=>a.map((o,i)=>`${x(i)},${y(o[k])}`).join(' '),dots=(k,c)=>a.map((o,i)=>o[k]===null?'':`<circle cx="${x(i)}" cy="${y(o[k])}" r="4" fill="#fff" stroke="${c}" stroke-width="2.5"/>`).join('');return `<div class="chart-wrap"><div class="legend"><span><i class="dot" style="background:#617fee"></i>Индекс дисциплины</span><span><i class="dot" style="background:#35ae91"></i>Привычки</span><span><i class="dot" style="background:#d06b85"></i>Цели</span></div><svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">${[0,.25,.5,.75,1].map(v=>`<path d="M${l} ${y(v)}H${w-r}" stroke="#e4eafa" stroke-dasharray="3 6"/><text x="0" y="${y(v)+4}" class="chart-label">${v*100}%</text>`).join('')}<polyline points="${line('discipline')}" fill="none" stroke="#617fee" stroke-width="3.5"/><polyline points="${line('habits')}" fill="none" stroke="#35ae91" stroke-width="3.5"/><polyline points="${line('goals')}" fill="none" stroke="#d06b85" stroke-width="3.5"/>${dots('discipline','#617fee')}${dots('habits','#35ae91')}${dots('goals','#d06b85')}${a.map((o,i)=>`<text x="${x(i)}" y="${h-8}" text-anchor="middle" class="chart-label">${new Intl.DateTimeFormat('ru-RU',{month:'short'}).format(new Date(o.month+'-01T12:00:00'))}</text>`).join('')}</svg></div><div class="chart-footer">Текущий месяц обновляется после каждой отметки; завершённые месяцы сохраняются для сравнения.</div>`}
function dashboard(){let s=live(mkey()),q=quality(s.discipline);return `<div class="hero"><div><div class="eyebrow">Личная операционная система</div><h1>Дисциплина в действии.</h1><p>${monthName(mkey())} · наблюдайте не только за результатом, но и за качеством своего состояния.</p></div><button class="button" data-tab="input">Отметить сегодняшний день</button></div><div class="grid"><article class="card"><div class="label">Индекс дисциплины</div><div class="metric">${s.discipline===null?'—':Math.round(s.discipline*100)+'%'}</div><div class="note">Среднее по четырём факторам за ${s.days} дней</div><span class="status">${q[0]}</span></article><article class="card"><div class="label">Ритм привычек</div><div class="metric">${s.habits===null?'—':Math.round(s.habits*100)+'%'}</div><div class="note">Только активный ростер привычек</div></article><article class="card"><div class="label">Текущий темп</div><div class="metric">${s.goals===null?'—':Math.round(s.goals*100)+'%'}</div><div class="note">Средний прогресс активных целей</div></article></div>${goalPanel()}${weekly()}<section class="section panel" style="padding:0"><div class="panel-top"><div><div class="label">Динамика по месяцам</div><b>Как меняется система</b></div><button class="button ghost" data-tab="review">Открыть историю</button></div>${chart()}</section>`}
function input(){let d=data.days.find(x=>x.date===today())||{date:today(),metrics:{},h:{},g:{}};let ins=dayInsight(d.metrics);return `<div class="hero"><div><div class="eyebrow">Ежедневная отметка</div><h1>Соберите сегодняшний день.</h1><p>Оцените четыре фактора по шкале от 1 до 10. Это субъективная оценка состояния, а не медицинский диагноз.</p></div></div><div class="panel entry"><div class="label">${today()}</div><div class="scale">${fields.map(([k,name,help])=>`<div class="scale-card"><b>${name}</b><small>${help}</small><input class="metric-input" data-k="${k}" type="number" min="1" max="10" step="1" value="${d.metrics[k]??''}" placeholder="1–10"></div>`).join('')}</div><div class="score-box" id="liveScore"><div class="score-ring" style="--p:${((avg(fields.map(([k])=>n(d.metrics[k])).filter(v=>v!==null))||0)*10)}%"><b>${Math.round((avg(fields.map(([k])=>n(d.metrics[k])).filter(v=>v!==null))||0)*10)}%</b></div><div class="verdict"><div class="label">Индекс сегодняшнего дня</div><b>${ins[0]}</b><p>${ins[1]}</p></div></div><section class="section"><div class="label">Отметка привычек</div><div class="roster" style="margin-top:10px">${data.habits.map(h=>`<div class="habit-row"><div class="habit-name">${esc(h.name)}<small>${esc(h.note)}</small></div><select class="dailyH" data-id="${h.id}"><option value="">Не отмечено</option><option value="1" ${Number(d.h?.[h.id])===1?'selected':''}>Выполнено</option><option value="0" ${Number(d.h?.[h.id])===0?'selected':''}>Не выполнено</option></select></div>`).join('')}</div></section><div class="form-grid" style="margin-top:10px">${data.goals.map(g=>`<div class="field"><label>${esc(g.name)}</label><select class="dailyG" data-id="${g.id}"><option value="">Нет отметки</option><option value="1" ${Number(d.g?.[g.id])===1?'selected':''}>Да</option><option value="0" ${Number(d.g?.[g.id])===0?'selected':''}>Нет</option></select></div>`).join('')}</div></section><button class="button" id="saveDay" style="margin-top:21px">Сохранить день</button></div>`}
function habits(){return `<div class="hero"><div><div class="eyebrow">Активный ростер</div><h1>Привычки.</h1><p>Привычки учитываются отдельно от индекса дневного состояния.</p></div><button class="button" id="addHabit">Добавить привычку</button></div><div class="roster">${data.habits.map(h=>`<div class="habit-row"><div class="habit-name">${esc(h.name)}<small>${esc(h.note)}</small></div><button class="button ghost editHabit" data-id="${h.id}">Изменить</button><button class="button ghost danger delHabit" data-id="${h.id}">Удалить</button></div>`).join('')}</div>`}
function review(){let a=[...data.monthSnapshots.filter(s=>s.month!==mkey()),live(mkey())].sort((x,y)=>y.month.localeCompare(x.month));return `<div class="hero"><div><div class="eyebrow">История роста</div><h1>Месяцы и результаты.</h1><p>Предыдущие месяцы фиксируются автоматически при первом запуске в новом месяце.</p></div></div><section class="panel">${chart()}</section><section class="section"><div class="table-wrap"><table><thead><tr><th>Месяц</th><th>Дней</th><th>Дисциплина</th><th>Привычки</th><th>Цели</th></tr></thead><tbody>${a.map(s=>`<tr><td>${monthName(s.month)}${s.month===mkey()?' · сейчас':''}</td><td>${s.days}</td><td>${s.discipline===null?'—':Math.round(s.discipline*100)+'%'}</td><td>${s.habits===null?'—':Math.round(s.habits*100)+'%'}</td><td>${s.goals===null?'—':Math.round(s.goals*100)+'%'}</td></tr>`).join('')}</tbody></table></div></section>`}
function settings(){return `<div class="hero"><div><div class="eyebrow">Данные</div><h1>Резервная копия.</h1><p>Экспортируйте данные перед обновлением приложения или очисткой браузера.</p></div></div><div class="grid"><div class="panel"><b>Экспорт</b><p class="note">Скачать все данные в JSON.</p><button class="button" id="export">Скачать копию</button></div><div class="panel"><b>Импорт</b><p class="note">Восстановить ранее сохранённую копию.</p><input type="file" id="import" accept="application/json"></div><div class="panel"><b>Сброс</b><p class="note">Удаляет данные только в этом браузере.</p><button class="button ghost danger" id="reset">Удалить данные</button></div></div>`}
function render(){nav();document.querySelectorAll('.tab').forEach(e=>e.classList.toggle('active',e.id===active));document.querySelector('#'+active).innerHTML=({dashboard,input,habits,review,settings})[active]();bind()}function bind(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{active=b.dataset.tab;render()});document.querySelector('#addGoal')?.addEventListener('click',()=>editGoal());document.querySelectorAll('.editGoal').forEach(b=>b.onclick=()=>editGoal(b.dataset.id));document.querySelectorAll('.editGoalLinks').forEach(b=>b.onclick=()=>editGoalLinks(b.dataset.id));document.querySelector('#addHabit')?.addEventListener('click',()=>editHabit());document.querySelectorAll('.editHabit').forEach(b=>b.onclick=()=>editHabit(b.dataset.id));document.querySelectorAll('.delHabit').forEach(b=>b.onclick=()=>{if(confirm('Удалить привычку?')){data.habits=data.habits.filter(h=>h.id!==b.dataset.id);save();render()}});document.querySelector('#saveDay')?.addEventListener('click',saveDay);document.querySelectorAll('.metric-input').forEach(i=>i.addEventListener('input',updateLive));document.querySelector('#export')?.addEventListener('click',exportData);document.querySelector('#import')?.addEventListener('change',importData);document.querySelector('#reset')?.addEventListener('click',()=>{if(confirm('Удалить все данные?')){localStorage.removeItem(KEY);data=normalize(null);save();render()}})}
function updateLive(){let m={};document.querySelectorAll('.metric-input').forEach(i=>m[i.dataset.k]=n(i.value));let out=dayInsight(m),a=avg(Object.values(m).filter(v=>v!==null)),p=Math.round((a||0)*10),box=document.querySelector('#liveScore');box.innerHTML=`<div class="score-ring" style="--p:${p}%"><b>${p}%</b></div><div class="verdict"><div class="label">Индекс сегодняшнего дня</div><b>${out[0]}</b><p>${out[1]}</p></div>`}function saveDay(){let metrics={};document.querySelectorAll('.metric-input').forEach(i=>metrics[i.dataset.k]=n(i.value));let h={};let existing=data.days.find(x=>x.date===today());let g=existing?.g||{};;document.querySelectorAll('.dailyH').forEach(x=>{if(x.value!=='')h[x.dataset.id]=Number(x.value)});let d={date:today(),metrics,h,g};let i=data.days.findIndex(x=>x.date===d.date);if(i<0)data.days.push(d);else data.days[i]=d;save();active='dashboard';render()}function editGoal(id){let g=data.goals.find(x=>x.id===id),name=prompt('Название цели',g?.name||'');if(!name?.trim())return;let plan=Number(prompt('План',g?.plan??1));if(!Number.isFinite(plan)||plan<=0)return;let fact=Number(prompt('Текущий факт',g?.fact??0)),unit=prompt('Единица измерения',g?.unit||'')??'';if(g)Object.assign(g,{name:name.trim(),plan,fact:Number.isFinite(fact)?fact:0,unit});else data.goals.push({id:uid(),name:name.trim(),plan,fact:Number.isFinite(fact)?fact:0,unit});save();render()}function editGoalLinks(id){let g=data.goals.find(x=>x.id===id);if(!g)return;if(!data.habits.length){alert('Сначала добавьте хотя бы одну привычку');return}let current=data.goalHabitLinks.filter(l=>l.goalId===id).map(l=>data.habits.findIndex(h=>h.id===l.habitId)+1).filter(n=>n>0).join(',');let text=data.habits.map((h,i)=>`${i+1}. ${h.name}`).join('\n');let answer=prompt(`Привычки для цели «${g.name}».\nВведите номера через запятую.\nОставьте поле пустым, чтобы убрать все связи.\n\n${text}`,current);if(answer===null)return;let indexes=[...new Set(answer.split(',').map(x=>Number(x.trim())-1).filter(i=>Number.isInteger(i)&&i>=0&&i<data.habits.length))];data.goalHabitLinks=data.goalHabitLinks.filter(l=>l.goalId!==id);indexes.forEach(i=>data.goalHabitLinks.push({goalId:id,habitId:data.habits[i].id}));save();render()}function editHabit(id){let h=data.habits.find(x=>x.id===id),name=prompt('Название привычки',h?.name||'');if(!name?.trim())return;let note=prompt('Короткое описание',h?.note||'')??'';if(h)Object.assign(h,{name:name.trim(),note});else data.habits.push({id:uid(),name:name.trim(),note});save();render()}function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='power-discipline-backup-'+today()+'.json';a.click();URL.revokeObjectURL(a.href)}function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{data=normalize(JSON.parse(r.result));rollover();save();render();alert('Данные восстановлены')}catch(err){alert('Не удалось прочитать файл')}};r.readAsText(f)}render()})();
</script><script src="power-discipline-v19-iteration-1-coach.js"></script><script src="pd-monthly-chart-stable.js"></script></body></html>
